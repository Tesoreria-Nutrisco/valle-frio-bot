    description: "Bot 1 - Descarga de cartolas y nóminas"
    entrypoint: src/flows/bot1_flow.py:bot1_flow
    work_pool:
      name: lenovo-rpa-pool
    pull:
      - prefect.deployments.steps.git_clone:
          repository: https://github.com/Tesoreria-Nutrisco/valle-frio-bot.git
          branch: master
    env:
      GOOGLE_DRIVE_CREDENTIALS_PATH: "./credentials.json"
      DRIVE_FOLDER_ID_CARTOLAS: "1wIMazNNEGuCV29kJwHfIgM_HiTFGcF_Z"
      DRIVE_FOLDER_ID_COMPROBANTES: "1kXrCcPI9xflRB0l59tvdd9xy5v2cEVfq"
      DRIVE_FOLDER_ID_NOMINAS: "1ah481Q2iQ2EzlZOgbhyszg18BjprlT4N"
      BANCO_NOMBRE_CARPETA: "consorcio"
      DOWNLOAD_TEMP_PATH: "./temp_downloads"
      MODO_DRY_RUN: "false"
      LOG_PATH: "./logs"
      SUPABASE_URL: "https://zczzcvlpvnwevoxfosdp.supabase.co"
      GAUSSDB_HOST: "10.252.0.149"
      GAUSSDB_PORT: "8000"
      GAUSSDB_DB: "gaussdb"
      GAUSSDB_USER: "CtasCorp"
    schedule:
      cron: "0 8,12,17 * * 1-5"
      timezone: America/Santiago
    tags:
      - valle-frio
      - bot1

