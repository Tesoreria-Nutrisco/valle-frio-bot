# Prefect deployment configuration
# Deploy: prefect deploy

deployments:
  - name: valle-frio-bot-1
    description: "Bot 1 - Descarga de cartolas y nóminas"
    entrypoint: src/flows/bot1_flow.py:bot1_flow
    work_pool:
      name: lenovo-rpa-pool
    pull:
      - prefect.deployments.steps.git_clone:
          repository: https://github.com/Tesoreria-Nutrisco/valle-frio-bot.git
          branch: master
    env:
      GOOGLE_DRIVE_CREDENTIALS_PATH: "./credentials.json"
      DRIVE_FOLDER_ID_CARTOLAS: "{{ prefect.blocks.secret.drive-folder-cartolas }}"
      DRIVE_FOLDER_ID_COMPROBANTES: "{{ prefect.blocks.secret.drive-folder-comprobantes }}"
      DRIVE_FOLDER_ID_NOMINAS: "{{ prefect.blocks.secret.drive-folder-nominas }}"
      BANCO_USUARIO: "{{ prefect.blocks.secret.banco-usuario }}"
      BANCO_CLAVE: "{{ prefect.blocks.secret.banco-clave }}"
      BANCO_NOMBRE_CARPETA: "consorcio"
      DOWNLOAD_TEMP_PATH: "./temp_downloads"
      MODO_DRY_RUN: "false"
      LOG_PATH: "./logs"
      SUPABASE_URL: "https://zczzcvlpvnwevoxfosdp.supabase.co"
      GAUSSDB_HOST: "{{ prefect.blocks.secret.gaussdb-host }}"
      GAUSSDB_PORT: "{{ prefect.blocks.secret.gaussdb-port }}"
      GAUSSDB_DB: "{{ prefect.blocks.secret.gaussdb-db }}"
      GAUSSDB_USER: "{{ prefect.blocks.secret.gauss-user }}"
      GAUSSDB_PASSWORD: "{{ prefect.blocks.secret.gaussdb-password }}"
    schedule:
      cron: "0 8,12,17 * * 1-5"
      timezone: America/Santiago
    tags:
      - valle-frio
      - bot1

  - name: valle-frio-bot-2
    description: "Bot 2 - Reconciliación Softland vs Cartola"
    entrypoint: src/flows/bot2_flow.py:bot2_flow
    work_pool:
      name: lenovo-rpa-pool
    pull:
      - prefect.deployments.steps.git_clone:
          repository: https://github.com/Tesoreria-Nutrisco/valle-frio-bot.git
          branch: master
    env:
      GOOGLE_DRIVE_CREDENTIALS_PATH: "./credentials.json"
      DRIVE_FOLDER_ID_CARTOLAS: "{{ prefect.blocks.secret.drive-folder-cartolas }}"
      DRIVE_FOLDER_ID_COMPROBANTES: "{{ prefect.blocks.secret.drive-folder-comprobantes }}"
      DRIVE_FOLDER_ID_NOMINAS: "{{ prefect.blocks.secret.drive-folder-nominas }}"
      BANCO_USUARIO: "{{ prefect.blocks.secret.banco-usuario }}"
      BANCO_CLAVE: "{{ prefect.blocks.secret.banco-clave }}"
      BANCO_NOMBRE_CARPETA: "consorcio"
      DOWNLOAD_TEMP_PATH: "./temp_downloads"
      MODO_DRY_RUN: "false"
      LOG_PATH: "./logs"
      SUPABASE_URL: "https://zczzcvlpvnwevoxfosdp.supabase.co"
      GAUSSDB_HOST: "{{ prefect.blocks.secret.gaussdb-host }}"
      GAUSSDB_PORT: "{{ prefect.blocks.secret.gaussdb-port }}"
      GAUSSDB_DB: "{{ prefect.blocks.secret.gaussdb-db }}"
      GAUSSDB_USER: "{{ prefect.blocks.secret.gauss-user }}"
      GAUSSDB_PASSWORD: "{{ prefect.blocks.secret.gaussdb-password }}"
      MODO_TEST: "false"
      CORREO_PRUEBA: "javiera.munozc@nutrisco.com"
    schedule:
      cron: "0 9,13,18 * * 1-5"
      timezone: America/Santiago
    tags:
      - valle-frio
      - bot2
